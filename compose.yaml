
services:
  webdev-curlette-mysql:
    image: mysql:8.0
    container_name: webdev-curlette-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} 
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - curlette-db-data:/var/lib/mysql
    networks:
      - curlette-network

  
  webdev-curlette-phpmyadmin:
    image: phpmyadmin
    container_name: webdev-curlette-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: webdev-curlette-mysql
    ports:
      - "8080:80"
    networks:
      - curlette-network

volumes:
  curlette-db-data:

networks:
  curlette-network:
    
